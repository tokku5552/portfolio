# Security floors for transitive dependencies. pnpm 12 no longer reads the
# "pnpm" field in package.json, so overrides live here. Keep each selector on
# the major its consumers declared; bumping the value to another major forces
# an API change onto those consumers.
overrides:
  form-data@4: ^4.0.6
  ws@8: ^8.21.0
  glob@10: ^14.0.0
  picomatch@2: ^2.3.2
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  postcss: ^8.5.23
  sharp: ^0.35.0
