overrides:
  form-data@4: ^4.0.6
  ws@8: ^8.21.0
  glob@10: ^14.0.0
  picomatch@2: ^2.3.2
  brace-expansion@1: ^5.0.0
  brace-expansion@2: ^5.0.0
  js-yaml@3: ^5.0.0
  js-yaml@4: ^4.3.1
  postcss: ^8.5.23
  sharp: ^0.35.0

# pnpm 12 fails the install when a dependency's build script is neither
# allowed nor denied. @parcel/watcher (pulled in by jest-haste-map from Jest
# 30) only compiles from source when npm_config_build_from_source is set and
# otherwise uses its prebuilt optional packages, so its script is denied.
allowBuilds:
  '@parcel/watcher': false
