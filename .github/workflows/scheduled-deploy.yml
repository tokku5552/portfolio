name: scheduled-deploy

# Periodically rebuild the production site so that SSG pages (`/`, `/articles`)
# pick up newly published articles from Zenn / Qiita / note.com.
# Triggers a Vercel Deploy Hook (bound to the `main` branch) stored in the
# `VERCEL_DEPLOY_HOOK_URL` repository secret.
on:
  schedule:
    # 21:00 UTC = 06:00 JST. GitHub may delay scheduled runs, especially at
    # the top of the hour, so the actual start time is approximate.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set. Create a Deploy Hook in Vercel (Project Settings > Git > Deploy Hooks, branch: main) and add its URL as a repository secret."
            exit 1
          fi
          curl -fsS --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL"
