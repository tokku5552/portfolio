name: ci
on:
  # No path filters: lint, test and build are required checks on main, so they
  # must report on every PR (a docs-only PR would otherwise never be mergeable).
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_PUBLIC_ENVIRONMENT: production
  NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: pnpm lint
        run: pnpm lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set timezone
        run: echo "TZ=Asia/Tokyo" >> $GITHUB_ENV
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: pnpm test
        run: pnpm test
  build:
    runs-on: ubuntu-latest
    # Also the type-check gate: `next build` runs TypeScript over the tsconfig
    # include (specs too). Keep `typescript.ignoreBuildErrors` off.
    # Server-only secret; only the build (getStaticProps) needs it.
    env:
      QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: build
        run: pnpm build
      - name: verify build output
        run: pnpm test:build
